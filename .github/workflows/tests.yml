name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest tests/ -v

  # Separate job (not folded into the matrix above) so torch + the MiDaS
  # weight download stay off the default fast/offline path: this is the one
  # leg that installs the `depth` extra, so test_midas_real_inference_sanity
  # (skipped everywhere else via pytest.importorskip("torch")) actually runs
  # against the real pretrained model instead of only being exercised
  # locally by whoever happens to have torch installed.
  test-depth-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,depth]"
      - name: Test
        run: pytest tests/ -v -k "midas or depth"

  # Informational only (continue-on-error): pip-audit flags known
  # vulnerabilities in installed deps. Currently *known* to report findings
  # in the pinned dev-tool ceilings (see ROADMAP_HONEST.md "Technical Debt" -
  # black and pytest each have an advisory whose fix version is blocked by
  # this repo's own pyproject.toml upper bound), so this does not gate merges
  # yet. Verified locally: `pip install pip-audit && pip-audit` runs fine
  # against this project's dependency set in this sandbox.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + dev deps
        run: pip install -e ".[dev]"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit
