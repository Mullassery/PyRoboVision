name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Lint with ruff
      run: ruff check . --show-fixes || true

    - name: Type check with mypy
      run: mypy . --ignore-missing-imports --no-error-summary 2>&1 | head -20 || true

    - name: Run tests
      run: pytest tests/ -v --cov=pyrobovision --cov-report=xml || true
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: always()

  rust:
    if: hashFiles('Cargo.toml') != ''
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cargo check
      run: cargo check --verbose
    
    - name: Cargo test
      run: cargo test --verbose --all
    
    - name: Cargo clippy
      run: cargo clippy --all-targets 2>cargo clippy --all-targets -- -D warnings1 | tee /tmp/clippy_output.txt || true
    
    - name: Cargo fmt
      run: cargo fmt --all -- --check
