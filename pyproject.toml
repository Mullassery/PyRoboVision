[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrobovision"
version = "3.0.0"
description = "Multi-object tracking (Kalman filter + Hungarian association) and trajectory prediction for robotics, with an optional real MiDaS monocular depth backend. Pure Python (NumPy + SciPy) core; PyTorch is optional."
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
maintainers = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
keywords = [
    "multi-object-tracking",
    "computer-vision",
    "kalman-filter",
    "hungarian-algorithm",
    "trajectory-prediction",
    "depth-estimation",
    "midas",
    "lidar",
    "occupancy-grid",
    "sensor-fusion",
    "robotics",
    "imitation-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"

# Only what pyrobovision's own code actually imports unconditionally.
dependencies = [
    "numpy>=1.24,<3.0",
    "scipy>=1.10,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<10.0",
    "pytest-cov>=4.1,<8.0",
    "black>=23.0,<26.0",
    "isort>=5.12,<7.0",
    "mypy>=1.4,<2.0",
    "ruff>=0.0.285,<1.0",
]

# Needed only for DepthEstimator(model="midas") (real MiDaS inference) and
# for pyrobovision.fusion.optimization.ModelOptimizer's ONNX export helpers.
# >=2.6 required: torch.load defaults changed to weights_only=True in 2.6,
# which is the safer default (this package does not call torch.load itself,
# but the floor keeps anyone who does on the safer default).
depth = [
    "torch>=2.6,<3.0",
    "pillow>=10.0,<12.0",
]

onnx = [
    "onnx>=1.15,<2.0",
    "onnxruntime>=1.17,<2.0",
]

[project.urls]
Homepage = "https://github.com/Mullassery/PyRoboVision"
Repository = "https://github.com/Mullassery/PyRoboVision"
Documentation = "https://github.com/Mullassery/PyRoboVision#readme"
"Bug Tracker" = "https://github.com/Mullassery/PyRoboVision/issues"
Changelog = "https://github.com/Mullassery/PyRoboVision/releases"
"Source Code" = "https://github.com/Mullassery/PyRoboVision/tree/main"
Discussions = "https://github.com/Mullassery/PyRoboVision/discussions"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyrobovision = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
skip_glob = ["*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --cov=pyrobovision (the package name) silently fails to resolve coverage
# data against this src/ layout in some coverage.py versions - it reports
# "No data was collected" even though the tests genuinely exercise the code.
# The path form works reliably.
addopts = "-v --cov=src/pyrobovision --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
