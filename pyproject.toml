[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrobovision"
version = "1.2.1"
description = "Complete autonomous driving stack: detection → multi-object tracking → 3D perception → end-to-end learning. Kalman filtering, trajectory prediction, safety-constrained policies, IMU/GPS fusion, GPU optimization."
readme = "README.md"

authors = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
maintainers = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
keywords = [
    "autonomous-driving",
    "computer-vision",
    "perception",
    "lidar-fusion",
    "3d-object-detection",
    "bev-bird-eye-view",
    "panoptic-segmentation",
    "semantic-segmentation",
    "camera-calibration",
    "vision-language-models",
    "clip",
    "segment-anything",
    "foundation-models",
    "self-driving",
    "robotics",
    "deep-learning",
    "neural-networks",
    "pytorch",
    "image-processing",
    "sensor-fusion",
    "automotive",
    "safety-critical",
    "ml-ops",
    "edge-ai"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"

dependencies = [
    "pyroboframes>=1.1.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.4.0",
    "ruff>=0.0.285",
]

cuda = [
    "cupy>=12.0.0",
    "torch[cuda11x]>=2.0.0",
]

mlx = [
    "mlx>=0.0.13",
]

vision3d = [
    "open3d>=0.17.0",
]

[project.urls]
Homepage = "https://github.com/Mullassery/PyRoboVision"
Repository = "https://github.com/Mullassery/PyRoboVision"
Documentation = "https://github.com/Mullassery/PyRoboVision#readme"
"Bug Tracker" = "https://github.com/Mullassery/PyRoboVision/issues"
Changelog = "https://github.com/Mullassery/PyRoboVision/releases"
"Source Code" = "https://github.com/Mullassery/PyRoboVision/tree/main"
Discussions = "https://github.com/Mullassery/PyRoboVision/discussions"

[tool.setuptools]
packages = ["pyrobovision"]

[tool.setuptools.package-data]
pyrobovision = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
skip_glob = ["*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=pyrobovision --cov-report=term-missing"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
